<!DOCTYPE html>
<html>

<head>
    <title>iPhone Calculator</title>
</head>

<body>
    <h1>iPhone Calculator</h1>
    <p>We offer an accurate and simple calculator to our users</p>
    <div class="calculator-container">
        <input readonly placeholder="0" />

        <table>
            <thead>
                <tr>
                    <th><button>C</button></th>
                    <th><button>+/-</button></th>
                    <th><button>%</button></th>
                    <th><button>÷</button></th>
                <tr>
                    <th><button>7</button></th>
                    <th><button>8</button></th>
                    <th><button>9</button></th>
                    <th><button>x</button></th>

                </tr>
                <tr>
                    <th><button>4</button></th>
                    <th><button>5</button></th>
                    <th><button>6</button></th>
                    <th><button>-</button></th>
                </tr>
                <tr>
                    <th><button>1</button></th>
                    <th><button>2</button></th>
                    <th><button>3</button></th>
                    <th><button>+</button></th>

                </tr>
                <tr>
                    <th><button>0</button></th>
                    <th></th>
                    <th><button>.</button></th>
                    <th><button>=</button></th>
                </tr>
                </tr>
            </thead>

        </table>
    </div>
    <footer>
        <p>Social Media:</p>
        <ul>
            <li><a href="https://www.facebook.com/">Facebook</a></li>
            <li><a href="https://twitter.com/">Twitter</a></li>
            <li><a href="https://www.instagram.com/">Instagram</a></li>
        </ul>
        <p>Copyrights reserved</p>
    </footer>

</body>

</html>
